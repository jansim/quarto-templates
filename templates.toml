# Templates shown in the gallery, in display order.
#
# Each [table] is one gallery entry; its key is the entry's id (used in URLs
# and output paths). Only `title` and `format` are required:
#
#   title    Display name.
#   format   Quarto format to render, e.g. "html", "typst", "riso-revealjs".
#            One per entry: a template with several formats gets an entry
#            for each.
#   repo     GitHub "owner/repo" the template comes from. Leave out for
#            Quarto's built-in formats, which render a shared sample from
#            samples/.
#   file     Document to render, relative to the repo root.
#            Default: "template.qmd" (what `quarto use template` creates).
#
# Optional:
#
#   ref          Branch or tag to render (default: the repo's default branch).
#   options      Format options merged into the document's front matter,
#                e.g. options = { titlepage = "formal" }, so one repo can
#                yield several entries.
#   remove-options  Format options to drop from the document's front matter,
#                as a list of keys ("a.b" for nested ones), e.g. a theme's
#                settings that don't suit the variant set in `options`.
#   description  One sentence shown in the template's popup. Only for what
#                the preview and title don't already convey; keep notes on
#                a template's look as comments instead.
#   preview-page Page of the PDF to use as the thumbnail (default: 1).
#   kind         "doc" or "slides", for formats whose base format suggests the
#                wrong one (e.g. Typst slide decks).
#   replace      Text replacements in the document, as [old, new] pairs, e.g.
#                to swap a code chunk for one that needs fewer R packages
#                (CI installs only knitr, rmarkdown and ggplot2). Trailing
#                whitespace is ignored; a build fails if `old` isn't found.
#
# Kind (document or slides), output (PDF or HTML) and typesetting engine
# (LaTeX, Typst or none) are inferred from the format name; the setup
# instructions are derived from `repo` and `file`.

# --- Built-in formats -------------------------------------------------------

[html]
title = "HTML Document"
format = "html"

[pdf]
title = "PDF Document (LaTeX)"
format = "pdf"

[typst]
title = "Typst Document"
format = "typst"

[revealjs]
title = "Reveal.js"
format = "revealjs"

[beamer]
title = "Beamer"
format = "beamer"

