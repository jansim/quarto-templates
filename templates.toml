# --- nmfs-opensci/quarto_titlepages -----------------------------------------

[titlepage-great-wave]
title = "Title Pages: Great Wave Cover"
repo = "nmfs-opensci/quarto_titlepages"
file = "example_2.qmd"
format = "titlepage-pdf"
description = "A full-bleed cover page, followed by a background-image title page."

[titlepage-formal]
title = "Title Pages: Formal"
repo = "nmfs-opensci/quarto_titlepages"
file = "example_2.qmd"
format = "titlepage-pdf"
options = { titlepage = "formal", coverpage = "none" }
remove-options = ["titlepage-bg-image"]  # the bg-image theme's corner graphic
preview-page = 2  # page 1 is the copyright page

[titlepage-vline]
title = "Title Pages: Vertical Line"
repo = "nmfs-opensci/quarto_titlepages"
file = "example_2.qmd"
format = "titlepage-pdf"
