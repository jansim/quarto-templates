# Uses mtcars instead of dplyr's starwars, and drops the slides that only
# demo table packages (DT, gt, reactable), to avoid installing them.
replace = [
  ["library(dplyr)\n", ""],
  ["g <- starwars", "g <- mtcars"],
  ["geom_point(aes(x = height, y = mass))", "geom_point(aes(x = wt, y = mpg))"],
  ['''tab <- starwars |>
  tidyr::drop_na(species) |>
  group_by(species) |>
  summarise(
    n = n(),
    mean_heigth = round(mean(height, na.rm = TRUE)),
    mean_mass = round(mean(mass, na.rm = TRUE))
  ) |>
  slice_max(order_by = n, n = 4)''', "tab <- head(mtcars[, 1:4], 4)"],
  ['''## `DT::datatable()` {.smaller}

With the `smaller` class in the slide!
Ex: `## slide name {.smaller}`

```{r}
DT::datatable(tab, options = list(pageLength = 5))
```

## `gt::gt()`

```{r}
gt::gt(tab)
```

## `reactable::reactable()`

```{r}
reactable::reactable(tab)
```

''', ""],
]

